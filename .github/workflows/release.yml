# Compila o APK do Ritmo e publica numa release do GitHub.
#
# Rodar: aba Actions → "Release do APK" → Run workflow (escolha a branch e, se quiser, o nome da release),
# ou envie uma tag que comece com "v" (ex.: git tag v0.7.0 && git push origin v0.7.0).
#
# O APK sai sempre com o nome ritmo.apk, então a versão mais nova fica sempre em:
#   https://github.com/KassioB/Ritmo/releases/latest/download/ritmo.apk
#
# Secrets opcionais (Settings → Secrets and variables → Actions):
#   GOOGLE_SERVICES_JSON   conteúdo do app/google-services.json (sem ele o login da conta na nuvem fica indisponível)
#   RITMO_KEYSTORE_BASE64  a keystore de release em base64 (base64 -w0 sua.keystore)
#   RITMO_STORE_PASSWORD, RITMO_KEY_ALIAS, RITMO_KEY_PASSWORD
# Sem a keystore, o workflow gera um APK de teste (debug), assinado com uma chave temporária.

name: Release do APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: Branch ou commit que vai ser compilado
        required: true
        default: main
      tag:
        description: Nome da release (vazio = v + versionName do app)
        required: false

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Configurar Firebase e assinatura
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          KEYSTORE_BASE64: ${{ secrets.RITMO_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RITMO_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RITMO_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RITMO_KEY_PASSWORD }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "FIREBASE=sim" >> "$GITHUB_ENV"
          else
            echo "FIREBASE=nao" >> "$GITHUB_ENV"
          fi
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p "$HOME/.ritmo"
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$HOME/.ritmo/release.keystore"
            {
              echo "storeFile=$HOME/.ritmo/release.keystore"
              echo "storePassword=$STORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > "$HOME/.ritmo/signing.properties"
            echo "ASSINADO=sim" >> "$GITHUB_ENV"
          else
            echo "ASSINADO=nao" >> "$GITHUB_ENV"
          fi

      - name: Compilar o APK
        run: |
          chmod +x gradlew
          if [ "$ASSINADO" = sim ]; then
            ./gradlew --no-daemon assembleRelease
            cp app/build/outputs/apk/release/app-release.apk ritmo.apk
          else
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ritmo.apk
          fi

      - name: Publicar a release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_INPUT: ${{ inputs.tag }}
          REF_INPUT: ${{ inputs.ref }}
        run: |
          VERSION=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -1)
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="${TAG_INPUT:-v$VERSION}"
          fi
          ORIGEM="${REF_INPUT:-$GITHUB_REF_NAME}"

          NOTES="Ritmo $VERSION, compilado a partir de \`$ORIGEM\` (commit $(git rev-parse --short HEAD))."
          if [ "$ASSINADO" = nao ]; then
            NOTES="$NOTES"$'\n\n'"⚠️ APK de teste, assinado com uma chave temporária. Se o Ritmo já estiver instalado com outra assinatura, o Android pede para desinstalar antes, e isso apaga os dados salvos no aparelho."
          fi
          if [ "$FIREBASE" = nao ]; then
            NOTES="$NOTES"$'\n\n'"⚠️ Compilado sem o google-services.json: o login da conta na nuvem fica indisponível nesta versão."
          fi
          NOTES="$NOTES"$'\n\n'"Para instalar, abra o ritmo.apk no celular e permita a instalação de apps desta fonte."

          gh release create "$TAG" ritmo.apk \
            -R "$GITHUB_REPOSITORY" \
            --target "$(git rev-parse HEAD)" \
            --title "Ritmo $VERSION" \
            --notes "$NOTES"
